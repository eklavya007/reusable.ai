<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f5;
            margin: 0;
            padding: 0;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        #chat-container {
            width: 100%;
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }

        #messages {
            height: 480px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .message {
            margin: 10px 0;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 85%;
            line-height: 1.4em;
            white-space: pre-wrap;
        }

        .user {
            background: #111827;
            color: white;
            margin-left: auto;
        }

        .ai {
            background: #eef2ff;
            color: #111827;
            margin-right: auto;
        }

        #input-area {
            display: flex;
            margin-top: 15px;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-right: 10px;
            font-size: 16px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        button:hover {
            background: #4338ca;
        }

        .option-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }

        .option-btn {
            background: #e0e7ff;
            color: #111827;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #c7d2fe;
            font-size: 15px;
        }

        .option-btn:hover {
            background: #c7d2fe;
        }
    </style>
</head>
<body>

<header id="header-title">AI Assistant Demo</header>

<div id="chat-container">
    <div id="messages"></div>

    <!-- Business Type Selection Buttons -->
    <div id="business-options" class="option-buttons" style="display:none;">
        <button class="option-btn" onclick="selectBusiness('eCommerce')">eCommerce</button>
        <button class="option-btn" onclick="selectBusiness('App')">App</button>
        <button class="option-btn" onclick="selectBusiness('Coaching / Info Product')">Coaching</button>
        <button class="option-btn" onclick="selectBusiness('Service Business')">Service Business</button>
        <button class="option-btn" onclick="selectBusiness('Agency')">Agency</button>
        <button class="option-btn" onclick="selectBusiness('Other')">Other</button>
    </div>

    <div id="input-area">
        <input
            type="text"
            id="user-input"
            placeholder="Or type your answer…"
        />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
// ----------------------------------------
// EDIT THIS NAME PER PROJECT
// ----------------------------------------
const COMPANY_NAME = "Favoured"; // change this for each new company

// Set header text based on company name
document.getElementById("header-title").textContent =
    COMPANY_NAME + " – AI Assistant Demo";

/* -------------------------------
   AUTO GREETING ON PAGE LOAD
-------------------------------- */
window.onload = () => {
    addMessage(
        `Quick question — what type of business are you running? eCom, app, coaching, or something else? I can tailor suggestions instantly if you let me know what type of business you run.`,
        "ai"
    );

    document.getElementById("business-options").style.display = "flex";
};

/* -------------------------------
   USER SELECTS BUSINESS TYPE
-------------------------------- */
function selectBusiness(type) {
    addMessage(type, "user");
    sendToAI(type);
    document.getElementById("business-options").style.display = "none";
}

/* -------------------------------
   USER SENDS TEXT ANSWER
-------------------------------- */
async function sendMessage() {
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";
    document.getElementById("business-options").style.display = "none";

    sendToAI(text);
}

/* -------------------------------
   SEND MESSAGE TO YOUR API
-------------------------------- */
async function sendToAI(userInput) {
    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: userInput }) // no company sent now
        });

        if (!response.ok) {
            const errorText = await response.text();
            console.error("API error:", errorText);
            addMessage("There was a problem talking to the server.", "ai");
            return;
        }

        const data = await response.json();
        addMessage(data.reply || "I couldn't generate a response.", "ai");
    } catch (err) {
        console.error("Fetch error:", err);
        addMessage("Network error – please try again.", "ai");
    }
}

/* -------------------------------
   ADD MESSAGE TO UI
-------------------------------- */
function addMessage(text, sender) {
    const container = document.getElementById("messages");
    const msg = document.createElement("div");
    msg.classList.add("message", sender);
    msg.textContent = text;
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
}
</script>

</body>
</html>
