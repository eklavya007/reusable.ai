<script>
// ----------------------------------------
// EDIT THIS NAME PER PROJECT
// ----------------------------------------
const COMPANY_NAME = "Favoured"; // change this per company

document.getElementById("header-title").textContent =
    COMPANY_NAME + " – AI Assistant Demo";

// Conversation history for the backend: { role: "user"|"assistant", content: "..." }
let conversation = [];

/* -----------------------------------------------
   AUTO GREETING ON PAGE LOAD
------------------------------------------------ */
window.onload = () => {
    const greeting =
        "Quick question — what type of business are you running? eCom, app, coaching, or something else? I can tailor suggestions instantly if you let me know what type of business you run.";
    addMessage(greeting, "ai");
    conversation.push({ role: "assistant", content: greeting });

    document.getElementById("business-options").style.display = "flex";

    // Attach Enter key handler once DOM is ready
    const input = document.getElementById("user-input");
    input.addEventListener("keydown", function (e) {
        // Shift + Enter → newline
        if (e.key === "Enter" && e.shiftKey) {
            return;
        }
        // Enter alone → send
        if (e.key === "Enter") {
            e.preventDefault();
            sendMessage();
        }
    });
};

/* -----------------------------------------------
   USER SELECTS BUSINESS TYPE
------------------------------------------------ */
function selectBusiness(type) {
    addMessage(type, "user");
    conversation.push({ role: "user", content: type });

    sendToAI();
    document.getElementById("business-options").style.display = "none";
}

/* -----------------------------------------------
   USER SENDS TEXT MESSAGE
------------------------------------------------ */
async function sendMessage() {
    const input = document.getElementById("user-input");
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    conversation.push({ role: "user", content: text });

    input.value = "";
    document.getElementById("business-options").style.display = "none";

    sendToAI();
}

/* -----------------------------------------------
   SEND FULL HISTORY TO BACKEND
------------------------------------------------ */
async function sendToAI() {
    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ history: conversation })
        });

        if (!response.ok) {
            const errorText = await response.text();
            console.error("API error:", errorText);
            addMessage("There was a problem talking to the server.", "ai");
            return;
        }

        const data = await response.json();
        const reply = data.reply || "I couldn't generate a response.";
        addMessage(reply, "ai");
        conversation.push({ role: "assistant", content: reply });

    } catch (err) {
        console.error("Fetch error:", err);
        addMessage("Network error – please try again.", "ai");
    }
}

/* -----------------------------------------------
   ADD MESSAGE TO UI
------------------------------------------------ */
function addMessage(text, sender) {
    const container = document.getElementById("messages");
    const msg = document.createElement("div");
    msg.classList.add("message", sender);
    msg.textContent = text;
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
}
</script>
